<!DOCTYPE html>
<html><head>
  <script>
    window.errors = [];
    window.onerror = function(msg, url, line, col, err) {
      window.errors.push({msg: msg, url: url, line: line, stack: err ? err.stack : ''});
      var d = document.createElement("div");
      d.id = "syntax-error";
      d.textContent = "SYNTAX/RUNTIME ERROR: " + msg + " in " + url + ":" + line;
      document.body.appendChild(d);
    };
  </script>
  <script src="lib/mini-docx.js"></script>
  <script src="js/tacoData.js"></script>

  <script src="js/docx-generator.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/sync-engine.js"></script>
  <script src="js/admin-manager.js"></script>
</head>
<body>
  <h1>Error Check</h1>
  <script>
    try {
      var d = document.createElement("div");
      d.id = "scripts-loaded";
      d.textContent = "All head scripts loaded OK! cases length: " + (typeof DEFAULT_CASES !== "undefined" ? DEFAULT_CASES.length : "undefined");
      document.body.appendChild(d);
    } catch (e) {
      var errD = document.createElement("div");
      errD.id = "body-error";
      errD.textContent = "Body error: " + e.message;
      document.body.appendChild(errD);
    }
  </script><div id="scripts-loaded">All head scripts loaded OK! cases length: 3</div>


</body></html>
