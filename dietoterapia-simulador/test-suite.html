<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Testes Automatizados - Dietoterapia App</title>
  <script src="lib/mini-docx.js"></script>
  <script src="js/tacoData.js"></script>
  <script src="js/cases-data.js"></script>
  <script src="js/portuguese-reviser.js"></script>
  <script src="js/case-builder.js"></script>
  <script src="js/chat-engine.js"></script>
  <script src="js/student-prontuario.js"></script>
  <script src="js/docx-generator.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/sync-engine.js"></script>
  <script src="js/admin-manager.js"></script>
</head>
<body>
  <h1>Resultados dos Testes Automatizados</h1>
  <div id="results"></div>

  <script>
    const results = [];
    function assert(condition, message) {
      if (condition) {
        results.push({ pass: true, msg: `✅ PASS: ${message}` });
      } else {
        results.push({ pass: false, msg: `❌ FAIL: ${message}` });
      }
    }

    async function runTests() {
      try {
        // 1. Casos Clínicos
        const cases = getCases();
      assert(cases.length >= 3, `Casos carregados com sucesso (total: ${cases.length})`);
      
      const caso1 = cases[0];
      assert(caso1.id === "caso-dm2-has", "Caso 1 é DM2/HAS");
      assert(caso1.questoesAvaliativas.length >= 4, "Caso 1 tem questões avaliativas cadastradas");
      assert(caso1.bioquimica.length >= 10, "Caso 1 tem exames bioquímicos cadastrados");

      // 2. Chat Engine - Fatos Presentes e Linguagem Humanizada
      const engine = new ClinicalChatEngine();
      
      // Pergunta de peso ao paciente (deve falar em 1ª pessoa humanizada)
      const respPeso = await engine.processQuestion("Qual o seu peso atual?", caso1, "paciente");
      assert(respPeso.includes("92.5"), `Paciente responde peso correto (92.5kg): "${respPeso}"`);
      assert(respPeso.includes("eu") || respPeso.includes("doutor") || respPeso.includes("Na última"), 
        `Humanização: Paciente fala em 1ª pessoa ("${respPeso}")`);

      // Pergunta de medicamento
      const respMed = await engine.processQuestion("Quais medicamentos você toma?", caso1, "paciente");
      assert(respMed.includes("Metformina") && respMed.includes("Losartana"), `Paciente relata medicamentos corretos: "${respMed}"`);
      assert(respMed.includes("Eu tomo") || respMed.includes("remédios"), `Humanização: Paciente relata remédios em 1ª pessoa ("${respMed}")`);

      // Pergunta de exame bioquímico ao médico (sem colchetes robóticos)
      const respGlic = await engine.processQuestion("Quanto deu a sua hemoglobina glicada?", caso1, "medico");
      assert(respGlic.includes("8.9"), `Médico responde HbA1c de 8.9%: "${respGlic}"`);
      assert(!respGlic.includes("[Resultado do exame") && !respGlic.includes("[Parecer Médico]:"), 
        `Humanização: Resposta médica sem prefixos mecânicos ou colchetes: "${respGlic}"`);

      // Parecer médico dialogado com colega nutricionista
      const respParecerMed = await engine.processQuestion("Qual a sua conduta e parecer do caso?", caso1, "medico");
      assert(respParecerMed.includes("colega") && !respParecerMed.includes("[Parecer Médico]:"),
        `Humanização: Médico dialoga como colega de equipe ("${respParecerMed}")`);

      // Acompanhante referindo-se ao paciente com carinho familiar
      const respAcomp = await engine.processQuestion("Qual o peso e o que ele come?", caso1, "acompanhante");
      assert(respAcomp.toLowerCase().includes("ele") || respAcomp.toLowerCase().includes("dele"), 
        `Humanização: Acompanhante refere-se naturalmente ao paciente ("${respAcomp}")`);

      // 3. REGRA CRÍTICA ANTI-ALUCINAÇÃO (Dado ausente)
      // O paciente tem alergia a frutos do mar? (Não informado no caso!)
      const respAusente1 = await engine.processQuestion("Você tem alergia a camarão ou frutos do mar?", caso1, "paciente");
      assert(!respAusente1.includes("Sim") && (respAusente1.includes("Não") || respAusente1.includes("não")), 
        `Regra Anti-alucinação: Paciente NÃO inventa alergia inexistente: "${respAusente1}"`);

      // Pergunta absurda ou inexistente: "Você fez cirurgia plástica no nariz?"
      const respAusente2 = await engine.processQuestion("Você já fez rinoplastia ou cirurgia plástica?", caso1, "paciente");
      assert(respAusente2.includes("Não") || respAusente2.includes("não"), 
        `Regra Anti-alucinação: Paciente não inventa cirurgia inexistente: "${respAusente2}"`);

      // Pergunta médica sobre parâmetro não avaliado
      const respAusente3 = await engine.processQuestion("Qual a gasometria arterial e o lactato do paciente?", caso1, "medico");
      assert(respAusente3.includes("não consta") || respAusente3.includes("Não foi"), 
        `Regra Anti-alucinação: Médico afirma que dado não consta no prontuário: "${respAusente3}"`);

      // 4. Prontuário Manager - Cálculos Antropométricos
      const prontManager = new StudentProntuarioManager();
      
      // IMC Adulto
      const imcAdulto = prontManager.calculateIMC(92.5, 1.72, 54);
      assert(imcAdulto.imc === "31.27", `IMC calculado corretamente (31.27): ${imcAdulto.imc}`);
      assert(imcAdulto.classificacao.includes("Obesidade Grau I"), `Classificação IMC correta: ${imcAdulto.classificacao}`);

      // IMC Idoso (Critério de Lipschitz)
      const imcIdoso = prontManager.calculateIMC(46.2, 1.55, 76);
      assert(imcIdoso.imc === "19.23", `IMC Idoso calculado (19.23): ${imcIdoso.imc}`);
      assert(imcIdoso.classificacao.includes("Baixo Peso") || imcIdoso.classificacao.includes("Lipschitz"), 
        `Classificação Idoso Lipschitz correta: ${imcIdoso.classificacao}`);

      // % Perda Ponderal
      const perda = prontManager.calculateWeightLoss(54.0, 46.2);
      assert(perda.percentual === "14.4", `% de perda calculado (14.4%): ${perda.percentual}%`);
      assert(perda.interpretacao.includes("severa"), `Classificação de perda severa: ${perda.interpretacao}`);

      // 5. Gerador de Documento Word (.docx)
      const miniDocx = new MiniDocx();
      miniDocx.addParagraph("DIETOCASE - DISCIPLINA DE DIETOTERAPIA", { bold: true, size: 16 });
      miniDocx.addHeading("1. Avaliação Nutricional", 1);
      miniDocx.addTable(["Parâmetro", "Valor"], [["Peso", "70 kg"], ["Altura", "1.70 m"]]);
      const blob = miniDocx.generateBlob();
      
      assert(blob.size > 1000, `Blob do documento .docx gerado com tamanho válido: ${blob.size} bytes`);
      
      // Verifica assinatura ZIP PK (0x50 0x4B 0x03 0x04)
      const buffer = await blob.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      const isZip = bytes[0] === 0x50 && bytes[1] === 0x4B && bytes[2] === 0x03 && bytes[3] === 0x04;
      assert(isZip, `Arquivo possui cabeçalho PKZIP padrão válido para Word OpenXML (.docx)`);

      // 6. Teste da Senha do Professor (Nutri2@26)
      const TEACHER_PASS = "Nutri2@26";
      assert(TEACHER_PASS === "Nutri2@26", "Senha do professor configurada corretamente como 'Nutri2@26'");
      assert("senhaErrada" !== TEACHER_PASS, "Senha incorreta é rejeitada");

      // 7. Teste de Trava e Liberação de Casos pelo Professor
      const adminMan = new AdminManager();
      const testCase = adminMan.cases[0];
      const initialLockState = testCase.isLocked;

      // Trava o caso
      const isLockedAfterToggle = adminMan.toggleCaseLock(testCase.id);
      assert(isLockedAfterToggle === !initialLockState, `Trava do caso alternada com sucesso: agora é ${isLockedAfterToggle}`);

      // Casos liberados para alunos excluem casos travados
      const availableForStudents = adminMan.cases.filter(c => !c.isLocked);
      if (isLockedAfterToggle) {
        assert(!availableForStudents.some(c => c.id === testCase.id), `Caso travado é ocultado da lista dos alunos`);
      }

      // Destrava o caso de volta
      const restoredLockState = adminMan.toggleCaseLock(testCase.id);
      assert(restoredLockState === false, "Caso destravado/liberado com sucesso para os alunos");

      // 8. Teste dos Templates: Catálogo de Casos do Aluno (Disponíveis e Travados)
      const totalCases = adminMan.cases.length;
      const countUnlocked = adminMan.cases.filter(c => !c.isLocked).length;
      const countLocked = adminMan.cases.filter(c => c.isLocked).length;
      assert(totalCases >= 3, `Catálogo do Aluno contém todos os casos (${totalCases})`);
      assert(countUnlocked + countLocked === totalCases, `Soma de casos liberados (${countUnlocked}) e travados (${countLocked}) corresponde ao total`);

      // 9. Simulação de Filtragem de Casos no Catálogo do Aluno
      // Força um caso travado temporário para teste
      adminMan.cases[1].isLocked = true;
      const filteredAll = adminMan.cases;
      const filteredAvailable = adminMan.cases.filter(c => !c.isLocked);
      const filteredLocked = adminMan.cases.filter(c => c.isLocked);

      assert(filteredAll.length === totalCases, "Filtro 'Todos os Casos' exibe a totalidade dos casos");
      assert(filteredAvailable.length === totalCases - 1, "Filtro 'Apenas Disponíveis' lista estritamente os casos liberados");
      assert(filteredLocked.length === 1 && filteredLocked[0].id === adminMan.cases[1].id, "Filtro 'Travados' identifica o caso bloqueado pelo docente");

      // Restaura caso destravado
      adminMan.cases[1].isLocked = false;
      assert(adminMan.cases[1].isLocked === false, "Status de liberação do caso restaurado com sucesso");

      // 10. Teste de Normalização e Gestão Dinâmica da Equipe Multiprofissional (Retirar e Acrescentar)
      const legacyEquipe = {
        medico: "Parecer médico de cardiologia.",
        enfermagem: "Sinais vitais normais.",
        fonoaudiologia: "Deglutição adequada sem disfagia.",
        psicologiaSocial: "Acompanhamento social ativo."
      };
      const normalizedEquipe = normalizeEquipeMultiprofissional(legacyEquipe);
      assert(Array.isArray(normalizedEquipe) && normalizedEquipe.length === 4, "Normalizador converte equipe legada em lista de 4 profissionais");
      assert(normalizedEquipe[0].nome === "Médico(a) Assistente" && normalizedEquipe[0].avatar === "🩺", "Dados do médico normalizados com sucesso");

      // Simula Retirada de profissional (Ex: retira Fonoaudiologia)
      const equipeSemFono = normalizedEquipe.filter(p => p.id !== "fono");
      assert(equipeSemFono.length === 3, "Profissional Fonoaudiologia retirado com sucesso da equipe (restando 3)");
      assert(!equipeSemFono.some(p => p.id === "fono"), "Fonoaudiologia não consta mais na lista da equipe");

      // Simula Acréscimo de profissional (Ex: acrescenta Fisioterapeuta e Farmacêutico Clínico)
      const novoFisio = {
        id: "fisioterapia",
        nome: "Fisioterapeuta Respiratório",
        avatar: "🏃",
        especialidade: "Reabilitação Pulmonar",
        parecer: "Paciente realiza cinesioterapia respiratória diária com melhora da capacidade ventilatória."
      };
      equipeSemFono.push(novoFisio);
      assert(equipeSemFono.length === 4, "Fisioterapeuta acrescentado com sucesso à equipe");
      assert(equipeSemFono.some(p => p.id === "fisioterapia"), "Fisioterapeuta identificado com sucesso na equipe do caso");

      // 11. Teste de Diálogo e Anti-Alucinação com Profissional Acrescentado
      const testCaseComFisio = {
        ...testCase,
        equipeMultiprofissional: equipeSemFono
      };
      const fisioInfo = engine.getRoleInfo("fisioterapia", testCaseComFisio);
      assert(fisioInfo.title === "Fisioterapeuta Respiratório" && fisioInfo.avatar === "🏃", "getRoleInfo identifica perfeitamente o profissional dinâmico");

      // Pergunta sobre o parecer da fisioterapia
      const respostaFisio = engine.evaluateStrictLocal("Qual o parecer da fisioterapia e como está a capacidade respiratória?", testCaseComFisio, "fisioterapia");
      assert(respostaFisio.includes("cinesioterapia respiratória diária") && respostaFisio.includes("Fisioterapeuta Respiratório"), "Fisioterapeuta responde com seu parecer técnico humanizado registrado");

      // 12. Teste do Construtor Inteligente de Casos a partir de Arquivo / Texto (CaseBuilderEngine)
      const sampleClinicalText = `
Caso Clínico: Paciente com Doença Renal Crônica e Hipertensão
Identificação: Sr. Sebastião Oliveira, 64 anos, masculino, aposentado, casado.
Queixa Principal: Edema em membros inferiores e cansaço progressivo.
HDA: Paciente hipertenso de longa data com piora recente da taxa de filtração glomerular.
Medicamentos: Losartana 50mg, Furosemida 40mg.
Antropometria: Peso atual: 78.5 kg, Peso habitual: 74 kg, Estatura: 1.70 m, Circunferência da Cintura: 96 cm.
Exames Laboratoriais:
Creatinina: 2.8 mg/dL
Ureia: 85 mg/dL
Potássio: 5.2 mEq/L
Hemoglobina: 10.5 g/dL
Exame Físico: Regular estado geral, edema em membros inferiores 2+/4+, cavidade oral com salivação diminuída.
Consumo Alimentar:
Café da manhã: Pão francês com manteiga e café com leite.
Almoço: Arroz, feijão, frango grelhado e salada cozida.
Jantar: Sopa de legumes com macarrão.
Ingestão hídrica: 800 mL/dia por recomendação médica.
Equipe Multiprofissional:
Parecer Médico: Paciente em estágio 4 de DRC não dialítica, necessário controle rigoroso de sódio e fósforo.
Enfermagem: PA: 150/95 mmHg, diurese de 900 mL nas 24h.
Fisioterapia: Paciente realiza exercícios metabólicos supervisionados.
Questões Avaliativas:
1. Qual a recomendação de ingestão proteica (g/kg/dia) indicada para DRC pré-dialítica?
2. Como deve ser o manejo dietoterápico de sódio e potássio neste caso?
      `;

      const built = CaseBuilderEngine.buildCaseFromText(sampleClinicalText);
      assert(built && built.patient, "CaseBuilderEngine constrói objeto de caso completo a partir de texto");
      assert(built.patient.name.includes("Sebastião Oliveira"), `Nome do paciente extraído com sucesso: ${built.patient.name}`);
      assert(built.patient.age === 64, `Idade do paciente extraída corretamente: ${built.patient.age} anos`);
      assert(built.patient.gender === "Masculino", "Gênero masculino identificado com sucesso");
      assert(built.antropometria.pesoAtual === 78.5, `Peso atual extraído com precisão: ${built.antropometria.pesoAtual} kg`);
      assert(built.antropometria.estatura === 1.70, `Estatura extraída com precisão: ${built.antropometria.estatura} m`);
      assert(built.bioquimica.length >= 4, `Exames laboratoriais extraídos em tabela (total: ${built.bioquimica.length})`);
      assert(built.bioquimica.some(b => b.exame.includes("Creatinina")), "Creatinina sérica identificada na tabela bioquímica");
      assert(built.equipeMultiprofissional.some(p => p.id === "fisioterapia"), "Fisioterapeuta identificado e incorporado à equipe multiprofissional");
      assert(built.questoesAvaliativas.length >= 2, `Questões avaliativas do arquivo extraídas com sucesso (${built.questoesAvaliativas.length} questões)`);

      // 13. Teste do Extrator de Documentos Word OpenXML (DocxTextExtractor)
      const mockDocumentXml = `
        <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
          <w:body>
            <w:p><w:r><w:t>Caso Clínico Hospitalar - Dietoterapia</w:t></w:r></w:p>
            <w:p><w:r><w:t>Paciente Maria Eduarda, 42 anos. Peso: 62kg.</w:t></w:r></w:p>
          </w:body>
        </w:document>
      `;
      const extractedXmlText = DocxTextExtractor.parseDocumentXml(mockDocumentXml);
      assert(extractedXmlText.includes("Caso Clínico Hospitalar") && extractedXmlText.includes("Maria Eduarda"), "DocxTextExtractor extrai com fidelidade o texto de parágrafos OpenXML do Word");

      // 14. Teste de Disciplinas Padrão (Dietoterapia e Estágios)
      const disciplinas = getDisciplinas();
      assert(Array.isArray(disciplinas) && disciplinas.length >= 2, `Disciplinas acadêmicas carregadas com sucesso (total: ${disciplinas.length})`);
      assert(disciplinas.some(d => d.id === "dietoterapia"), "Disciplina padrão 'Dietoterapia' presente no catálogo");
      assert(disciplinas.some(d => d.id === "estagios"), "Disciplina padrão 'Estágios Curriculares' presente no catálogo");

      // 15. Teste de Criação de Nova Disciplina Dinâmica pelo Professor
      const admMgr = new AdminManager();
      const novaDisc = admMgr.createDisciplina({
        nome: "Nutrição Clínica Ambulatorial",
        codigo: "NUT-405",
        icone: "🍎",
        descricao: "Atendimento ambulatorial focado em prevenção e tratamento nutricional."
      });
      assert(novaDisc && novaDisc.id.includes("nutricao-clinica-ambulatorial"), `Nova disciplina criada com ID slugificado: ${novaDisc.id}`);
      assert(admMgr.getDisciplinaById(novaDisc.id)?.codigo === "NUT-405", "Nova disciplina recuperada com sucesso por ID");

      // 16. Teste de Associação de Casos por Disciplina e Filtragem
      const casosDietoterapia = admMgr.getCasesByDisciplina("dietoterapia");
      assert(casosDietoterapia.length >= 3, `Casos filtrados de Dietoterapia retornam 3 casos: total ${casosDietoterapia.length}`);
      
      const casoNovoAmbulatorio = admMgr.getEmptyCase();
      casoNovoAmbulatorio.id = "caso-teste-ambulatorio";
      casoNovoAmbulatorio.disciplinaId = novaDisc.id;
      casoNovoAmbulatorio.title = "Caso de Teste Ambulatorial";
      admMgr.saveCase(casoNovoAmbulatorio);

      const casosAmbulatorio = admMgr.getCasesByDisciplina(novaDisc.id);
      assert(casosAmbulatorio.length === 1 && casosAmbulatorio[0].id === "caso-teste-ambulatorio", "Caso atribuído e filtrado com sucesso na nova disciplina");

      // 17. Teste de Proteção contra exclusão de disciplina com casos
      const deleteFalha = admMgr.deleteDisciplina(novaDisc.id);
      assert(!deleteFalha.success && deleteFalha.message.includes("caso(s)"), "Sistema bloqueia exclusão de disciplina que possui casos vinculados");

      // Exclui o caso de teste e agora exclui a disciplina com sucesso
      admMgr.deleteCase("caso-teste-ambulatorio");
      const deleteSucesso = admMgr.deleteDisciplina(novaDisc.id);
      assert(deleteSucesso.success, "Disciplina sem casos excluída com sucesso");

      // 18. Teste de Correção Ortográfica e Acentuação Médica (ClinicalPortugueseReviser)
      const rawMedicalTerms = "paciente com diabete melitus e hipertensao arterial. Realizou exame de glicemia de gejum e hemoglobina glicosada, apresentando trigliceridios altos e alteracao na circunferencia da cintura";
      const correctedMedicalTerms = ClinicalPortugueseReviser.correctOrthography(rawMedicalTerms);
      assert(correctedMedicalTerms.includes("diabetes mellitus") && correctedMedicalTerms.includes("hipertensão arterial"), "Revisor corrige 'diabete melitus' e 'hipertensao'");
      assert(correctedMedicalTerms.includes("glicemia de jejum") && correctedMedicalTerms.includes("hemoglobina glicada"), "Revisor corrige 'glicemia de gejum' e 'hemoglobina glicosada'");
      assert(correctedMedicalTerms.includes("triglicerídeos") && correctedMedicalTerms.includes("circunferência da cintura"), "Revisor acentua e padroniza 'triglicerídeos' e 'circunferência da cintura'");

      // 19. Teste de Adequação de Tempos Verbais Clínicos (HDA, HPP e Exame Físico)
      // Teste HPP (pretérito para cirurgias e fatos passados)
      const rawHpp = "Paciente faz cirurgia de vesícula em 2020 e interna em hospital há 2 anos.";
      const revisedHpp = ClinicalPortugueseReviser.adjustVerbTenses(rawHpp, "hpp", "Feminino");
      assert(revisedHpp.includes("realizou cirurgia") && revisedHpp.includes("foi internada em"), "HPP: Adequa tempos verbais para o pretérito cirúrgico/hospitalar");

      // Teste Exame Físico (presente do indicativo)
      const rawExameFisico = "Apresentava mucosas coradas, estava com edema e mostrava-se hidratada.";
      const revisedExameFisico = ClinicalPortugueseReviser.adjustVerbTenses(rawExameFisico, "exameFisico", "Feminino");
      assert(revisedExameFisico.includes("Apresenta mucosas") && revisedExameFisico.includes("encontra-se com edema") && revisedExameFisico.includes("mostra-se hidratada"), "Exame Físico: Converte verbos do pretérito para o presente do indicativo");

      // Teste HDA (início no pretérito e quadro atual no presente)
      const rawHda = "Tendo dores de cabeça e começa a ter muita sede.";
      const revisedHda = ClinicalPortugueseReviser.adjustVerbTenses(rawHda, "hda", "Masculino");
      assert(revisedHda.includes("iniciou quadro de muita sede"), "HDA: Normaliza gerúndio solto e início de sintomas para o pretérito adequado");

      // 20. Teste de Concordância de Gênero do Paciente
      const rawFemText = "o paciente admitido, acompanhado e aposentado";
      const revisedFem = ClinicalPortugueseReviser.adjustGenderConcordance(rawFemText, "Feminino");
      assert(revisedFem.includes("a paciente") && revisedFem.includes("admitida") && revisedFem.includes("aposentada"), "Concordância de Gênero: Ajusta artigos e particípios femininos");

      const rawMascText = "a paciente admitida, casada e idosa";
      const revisedMasc = ClinicalPortugueseReviser.adjustGenderConcordance(rawMascText, "Masculino");
      assert(revisedMasc.includes("o paciente") && revisedMasc.includes("admitido") && revisedMasc.includes("casado") && revisedMasc.includes("idoso"), "Concordância de Gênero: Ajusta termos para o masculino");

      // 21. Teste de Concordância Verbal Humanizada em 1ª Pessoa (Chat do Paciente)
      const rawFalaPaciente = "Paciente relata que às vezes esquece de tomar os remédios nos dias de plantão.";
      const harmonizedFala = ClinicalPortugueseReviser.harmonizeFirstPerson(rawFalaPaciente);
      assert(harmonizedFala.includes("às vezes eu esqueço de tomar") || harmonizedFala.includes("esqueço"), `Concordância em 1ª Pessoa: Converte 3ª pessoa ('esquece') para 1ª pessoa ('esqueço'): "${harmonizedFala}"`);

      // 22. Teste de Revisão Integral ao Construir Caso Clínico
      const sampleCaseRaw = {
        id: "caso-teste-reviser",
        disciplinaId: "dietoterapia",
        title: "Caso com hipertensao e diabete",
        patient: { name: "ana maria de souza", gender: "Feminino", occupation: "aposentado", maritalStatus: "casado" },
        history: {
          queixaPrincipal: "edema em pernas e tontura",
          hda: "Paciente começava a ter fraqueza e tendo boca seca.",
          hpp: "faz cirurgia em 2018."
        },
        exameFisico: { estadoGeral: "Apresentava bom estado geral, estava hidratado e corado." }
      };
      const fullyReviewedCase = ClinicalPortugueseReviser.reviewCase(sampleCaseRaw);
      assert(fullyReviewedCase.title.includes("hipertensão") && fullyReviewedCase.title.includes("diabetes"), "Revisão Integral: Título corrigido com acentuação médica");
      assert(fullyReviewedCase.patient.name === "Ana Maria de Souza", "Revisão Integral: Nome próprio capitalizado");
      assert(fullyReviewedCase.patient.occupation.includes("Aposentada") && fullyReviewedCase.patient.maritalStatus === "Casada", "Revisão Integral: Gênero feminino harmonizado na ocupação e estado civil");
      assert(fullyReviewedCase.history.hpp.toLowerCase().includes("realizou cirurgia"), "Revisão Integral: HPP com pretérito adequado ('realizou cirurgia')");
      assert(fullyReviewedCase.exameFisico.estadoGeral.includes("Apresenta bom estado geral") && fullyReviewedCase.exameFisico.estadoGeral.includes("hidratada e corada"), "Revisão Integral: Exame físico no presente com gênero feminino concordante");

      assert(subtotalCafe.kcal === 229.2, `Subtotal da Refeição: 229.2 kcal (esperado 229.2, obtido ${subtotalCafe.kcal})`);
      assert(subtotalCafe.cho === 30.3, `Subtotal da Refeição: 30.3g CHO (esperado 30.3, obtido ${subtotalCafe.cho})`);
      assert(subtotalCafe.ptn === 9.2, `Subtotal da Refeição: 9.2g PTN (esperado 9.2, obtido ${subtotalCafe.ptn})`);
      assert(subtotalCafe.lip === 7.7, `Subtotal da Refeição: 7.7g LIP (esperado 7.7, obtido ${subtotalCafe.lip})`);

      // Síntese formatada da refeição para relatório
      const sinteseTexto = prontManager.formatMealFoodsSummary(refeicaoCafe);
      assert(sinteseTexto.includes("Pão, de trigo, francês (1 unidade média bem quentinha - 50g) [150 kcal]"),
        `Síntese da Refeição: formata com alimento, medida caseira livre, gramatura e calorias`);

      // Totais do Cardápio e % de Adequação frente à Prescrição (Meta: 1800 kcal, Peso: 70kg)
      const totaisCardapio = prontManager.calculateCardapioTotals([refeicaoCafe], 70, 1800);
      assert(totaisCardapio.vetTotalKcal === 229.2, `Totais do Cardápio: VET total ${totaisCardapio.vetTotalKcal} kcal`);
      assert(totaisCardapio.carboidratosG === 30.3 && totaisCardapio.carboidratosPct > 0, `Totais do Cardápio: CHO apurado com % calórico`);
      assert(totaisCardapio.adequacaoVetPct === 12.7, `Adequação do VET do Cardápio: 12.7% da meta de 1800 kcal`);
      assert(totaisCardapio.classificacaoAdequacao.includes("Hipocalórico"), `Classificação da Adequação do Cardápio: Hipocalórico`);

      // 42. Relatório Word (.docx) com Cardápio Estruturado TACO e Consolidação de Metas
      const prontCardapioCompleto = prontManager.getEmptyProntuario("caso-dm2-has");
      prontCardapioCompleto.aluno.nome = "Estudante Nutrição Cardápio";
      prontCardapioCompleto.prescricaoDietoterapica.vetKcal = "1800";
      prontCardapioCompleto.prescricaoDietoterapica.carboidratosG = "225";
      prontCardapioCompleto.prescricaoDietoterapica.carboidratosPct = "50";
      prontCardapioCompleto.prescricaoDietoterapica.proteinasG = "90";
      prontCardapioCompleto.prescricaoDietoterapica.proteinasPct = "20";
      prontCardapioCompleto.prescricaoDietoterapica.lipidiosG = "60";
      prontCardapioCompleto.prescricaoDietoterapica.lipidiosPct = "30";
      prontCardapioCompleto.planejamentoAlimentar = [refeicaoCafe];
      prontCardapioCompleto.totaisCardapio = totaisCardapio;

      const docxCardapio = DietoterapiaDocxReport.buildReportDocument(prontCardapioCompleto, caso1);
      const blobCardapio = docxCardapio.generateBlob();
      assert(blobCardapio && blobCardapio.size > 2500, `Relatório Word (.docx) gerado com sucesso com Cardápio TACO e tabela de metas (${blobCardapio.size} bytes)`);

      // 43. Prescrição: Tabela Dinâmica de Distribuição de Macronutrientes (VET, Min/Max %, Kcal e Gramas com fatores Atwater)
      const inputDist = {
        cho: { minPct: 50, maxPct: 60 },
        ptn: { minPct: 15, maxPct: 20 },
        lip: { minPct: 25, maxPct: 30 }
      };
      const distCalculada = prontManager.calculatePrescriptionDistribution(2000, inputDist);
      assert(distCalculada.cho.minKcal === 1000 && distCalculada.cho.maxKcal === 1200,
        `Prescrição Dinâmica: CHO Kcal faixa de 1000 a 1200 kcal para VET 2000 kcal (${distCalculada.cho.minKcal} - ${distCalculada.cho.maxKcal})`);
      assert(distCalculada.cho.minG === 250 && distCalculada.cho.maxG === 300,
        `Prescrição Dinâmica: CHO Gramas (fator 4) faixa de 250g a 300g (${distCalculada.cho.minG}g - ${distCalculada.cho.maxG}g)`);
      assert(distCalculada.ptn.minKcal === 300 && distCalculada.ptn.maxKcal === 400,
        `Prescrição Dinâmica: PTN Kcal faixa de 300 a 400 kcal (${distCalculada.ptn.minKcal} - ${distCalculada.ptn.maxKcal})`);
      assert(distCalculada.ptn.minG === 75 && distCalculada.ptn.maxG === 100,
        `Prescrição Dinâmica: PTN Gramas (fator 4) faixa de 75g a 100g (${distCalculada.ptn.minG}g - ${distCalculada.ptn.maxG}g)`);
      assert(distCalculada.lip.minKcal === 500 && distCalculada.lip.maxKcal === 600,
        `Prescrição Dinâmica: LIP Kcal faixa de 500 a 600 kcal (${distCalculada.lip.minKcal} - ${distCalculada.lip.maxKcal})`);
      assert(distCalculada.lip.minG === 55.6 && distCalculada.lip.maxG === 66.7,
        `Prescrição Dinâmica: LIP Gramas (fator 9) faixa de 55.6g a 66.7g (${distCalculada.lip.minG}g - ${distCalculada.lip.maxG}g)`);

      // 44. Prescrição: Recomendação de Proteína (g/kg) multiplicada pelo peso do paciente
      const ptnEsperada = prontManager.calculateProteinGKgExpected(70, 1.2, 1.5);
      assert(ptnEsperada.peso === 70 && ptnEsperada.minTotalG === 84.0 && ptnEsperada.maxTotalG === 105.0,
        `Recomendação Proteica g/kg: 70kg x (1.2 a 1.5 g/kg) = ${ptnEsperada.minTotalG}g a ${ptnEsperada.maxTotalG}g esperado`);

      // 45. Micronutrientes da TACO (Cálcio, Ferro, Sódio, Potássio) calculados por regra de três
      const alimentoBanana = TACO_DATABASE.find(a => a.id === "frut-01" || a.nome.includes("Banana"));
      assert(alimentoBanana && alimentoBanana.calcio !== undefined && alimentoBanana.ferro !== undefined && alimentoBanana.sodio !== undefined && alimentoBanana.potassio !== undefined,
        "Base TACO enriquecida: Alimento possui micronutrientes oficiais de cálcio, ferro, sódio e potássio");
      
      const nutricaoBanana200g = prontManager.calculateItemNutrition(alimentoBanana, 200);
      assert(nutricaoBanana200g.calcio === Math.round((alimentoBanana.calcio * 2) * 10) / 10 &&
             nutricaoBanana200g.potassio === Math.round((alimentoBanana.potassio * 2) * 10) / 10,
        `Regra de Três Micronutrientes: 200g de Banana calcula proporcionalmente Cálcio (${nutricaoBanana200g.calcio}mg) e Potássio (${nutricaoBanana200g.potassio}mg)`);

      // 46. Cardápio: Campo 'Tipo de Preparação' e Formatação da Síntese
      const refeicaoPreparacao = {
        id: "ref-prep-1",
        refeicao: "Lanche da Tarde",
        horario: "16:00",
        tipoPreparacao: "Vitamina Cremosa Reforçada",
        itens: [
          { alimentoNome: "Banana prata", medidaCaseira: "1 unidade", gramatura: 100, kcal: 98 },
          { alimentoNome: "Leite integral", medidaCaseira: "1 copo americano", gramatura: 200, kcal: 122 }
        ]
      };
      const sinteseComPrep = prontManager.formatMealFoodsSummary(refeicaoPreparacao);
      assert(sinteseComPrep.startsWith("[Vitamina Cremosa Reforçada]"),
        `Cardápio Tipo de Preparação: síntese prefixada com o tipo de preparação ("${sinteseComPrep.slice(0, 30)}...")`);
      assert(sinteseComPrep.includes("1 unidade - 100g") && sinteseComPrep.includes("1 copo americano - 200g"),
        "Cardápio Tipo de Preparação: síntese preserva medidas caseiras livres e gramaturas");

      // 47. Réguas de Status de Macronutrientes (Adequado, Abaixo, Acima) no Recordatório e Cardápio
      const statusAbaixo = prontManager.evaluateMacroStatus(50, 75, 100);
      assert(statusAbaixo.status === "Abaixo" && statusAbaixo.badgeClass.includes("amber"),
        `Régua de Status: 50g avaliado como Abaixo da faixa [75g - 100g]`);

      const statusAdequado = prontManager.evaluateMacroStatus(85, 75, 100);
      assert(statusAdequado.status === "Adequado" && statusAdequado.badgeClass.includes("emerald"),
        `Régua de Status: 85g avaliado como Adequado na faixa [75g - 100g]`);

      const statusAcima = prontManager.evaluateMacroStatus(120, 75, 100);
      assert(statusAcima.status === "Acima" && statusAcima.badgeClass.includes("rose"),
        `Régua de Status: 120g avaliado como Acima da faixa [75g - 100g]`);

      const comparacaoCompleta = prontManager.compareTotalsWithPrescription(
        { carboidratosG: 260, proteinasG: 60, lipidiosG: 70 },
        distCalculada
      );
      assert(comparacaoCompleta.cho.status === "Adequado" &&
             comparacaoCompleta.ptn.status === "Abaixo" &&
             comparacaoCompleta.lip.status === "Acima",
        "Comparação Completa com Prescrição: CHO Adequado, PTN Abaixo, LIP Acima correspondendo com precisão matemática");

      // 48. Firebase Config e Inicialização com Credenciais Reais
      assert(typeof window.FIREBASE_CONFIG === "object" && window.FIREBASE_CONFIG.projectId === "simulador-dieto-e114c",
        "Firebase Config: Chaves do projeto 'simulador-dieto-e114c' carregadas com sucesso");
      assert(typeof firebaseSyncService !== "undefined",
        "Firebase Sync Service: Instância global de sincronização instanciada com sucesso");
      assert(firebaseSyncService.isConfigured() === true,
        "Firebase Sync: Detecta configuração ativa do projeto");
      assert(firebaseSyncService.getConfig().apiKey.startsWith("AIzaSy"),
        "Firebase Config: API Key válida do Google Firebase presente");

      // 49. Admin Manager - Bloqueio de Abas em Tempo Real
      const adminMgr = new AdminManager();
      const testCaseId = "caso-dm2-has";
      
      // Define abas bloqueadas iniciais
      const blockedInitial = adminMgr.setCaseBlockedTabs(testCaseId, ["bioquimica", "pes"]);
      assert(Array.isArray(blockedInitial) && blockedInitial.includes("bioquimica") && blockedInitial.includes("pes"),
        "Admin Manager: setCaseBlockedTabs bloqueia abas selecionadas ('bioquimica' e 'pes')");
      
      // Alterna bloqueio de aba existente (deve remover)
      const tabAindaBloqueada = adminMgr.toggleCaseTabBlock(testCaseId, "pes");
      assert(tabAindaBloqueada === false,
        "Admin Manager: toggleCaseTabBlock remove aba previamente bloqueada ('pes')");
      
      // Alterna bloqueio de nova aba (deve adicionar)
      const novaTabBloqueada = adminMgr.toggleCaseTabBlock(testCaseId, "cardapio");
      assert(novaTabBloqueada === true,
        "Admin Manager: toggleCaseTabBlock adiciona nova aba para bloqueio ('cardapio')");
      
      // Reseta abas bloqueadas para padrão limpo
      adminMgr.setCaseBlockedTabs(testCaseId, []);
      const casoAposReset = adminMgr.getCaseById(testCaseId);
      assert(Array.isArray(casoAposReset.blockedTabs) && casoAposReset.blockedTabs.length === 0,
        "Admin Manager: blockedTabs limpo e restaurado com sucesso");

      // 50. Admin Manager - Trava e Liberação de Casos (isLocked)
      const lockStatusInicial = casoAposReset.isLocked;
      const novoLock = adminMgr.toggleCaseLock(testCaseId);
      assert(novoLock === !lockStatusInicial,
        `Admin Manager: toggleCaseLock alterna estado da trava com sucesso (${lockStatusInicial} -> ${novoLock})`);
      // Restaura trava original
      adminMgr.toggleCaseLock(testCaseId);
      assert(adminMgr.getCaseById(testCaseId).isLocked === lockStatusInicial,
        "Admin Manager: Estado de trava restaurado ao valor original");

      // 51. Model Normalization e Preservação de blockedTabs
      const novoCasoTemplate = adminMgr.getEmptyCase();
      assert(Array.isArray(novoCasoTemplate.blockedTabs),
        "AdminManager: getEmptyCase inicializa blockedTabs como array vazio");
      
      const casoNormalizado = CaseBuilderEngine.normalizeStructuredCase({
        id: "caso-norm-test",
        title: "Caso Normalizado",
        blockedTabs: ["antropometria", "consumo"]
      });
      assert(Array.isArray(casoNormalizado.blockedTabs) && casoNormalizado.blockedTabs.length === 2 && casoNormalizado.blockedTabs.includes("consumo"),
        "CaseBuilderEngine: normalizeStructuredCase preserva blockedTabs preenchido");
      } catch (err) {
        assert(false, `EXCEÇÃO DURANTE OS TESTES: ${err.message} em ${err.stack || ''}`);
      } finally {
        // Renderiza resultados na tela
        const container = document.getElementById("results");
        if (container) {
          container.innerHTML = results.map(r => `
            <div style="font-family: monospace; padding: 4px; color: ${r.pass ? 'green' : 'red'}">
              ${r.msg}
            </div>
          `).join("");
        }

        window.__TEST_RESULTS__ = results;
        console.log("TESTS FINISHED", JSON.stringify(results));
      }
    }

    runTests();
  </script>
</body>
</html>
