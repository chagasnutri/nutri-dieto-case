<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#f8fafc;">
  <iframe id="appFrame" src="index.html" style="width:1366px;height:900px;border:none;"></iframe>
  <script>
    const iframe = document.getElementById('appFrame');
    const urlParams = new URLSearchParams(window.location.search);
    const targetTab = urlParams.get('tab') || 'antropometria';

    iframe.onload = () => {
      setTimeout(() => {
        const win = iframe.contentWindow;
        const doc = iframe.contentDocument || win.document;

        // Inicia a simulaÃ§Ã£o do primeiro caso
        if (typeof win.startCaseFromCatalog === 'function') {
          win.startCaseFromCatalog('caso-dm2-has');
        }

        setTimeout(() => {
          // Clica no botÃ£o da aba desejada
          const tabBtn = doc.querySelector(.student-tab-btn[data-tab="\"]);
          if (tabBtn) tabBtn.click();

          setTimeout(() => {
            if (targetTab === 'antropometria') {
              // Preenche antropometria alternativa de Chumlea (sem peso/estatura reais para demonstrar Chumlea)
              const pAtual = doc.getElementById('prontPesoAtual');
              const est = doc.getElementById('prontEstatura');
              const aj = doc.getElementById('prontAlturaJoelho');
              const cb = doc.getElementById('prontCircBraco');
              const cp = doc.getElementById('prontCircPanturrilha');
              const punho = doc.getElementById('prontCircPunho');
              const dct = doc.getElementById('prontDobraTricipital');
              const dcse = doc.getElementById('prontDobraSubescapular');

              if (pAtual) { pAtual.value = ''; pAtual.dispatchEvent(new Event('input')); }
              if (est) { est.value = ''; est.dispatchEvent(new Event('input')); }
              if (aj) { aj.value = '53.5'; aj.dispatchEvent(new Event('input')); }
              if (cb) { cb.value = '31.0'; cb.dispatchEvent(new Event('input')); }
              if (cp) { cp.value = '38.0'; cp.dispatchEvent(new Event('input')); }
              if (punho) { punho.value = '17.5'; punho.dispatchEvent(new Event('input')); }
              if (dct) { dct.value = '22.0'; dct.dispatchEvent(new Event('input')); }
              if (dcse) { dcse.value = '25.0'; dcse.dispatchEvent(new Event('input')); }
            } else if (targetTab === 'consumo') {
              // Preenche VET do RecordatÃ³rio e busca alimento TACO
              const vetInput = doc.getElementById('prontVetRecordatorio');
              if (vetInput) {
                vetInput.value = '1450';
                vetInput.dispatchEvent(new Event('input'));
              }
              const tacoSearch = doc.getElementById('tacoSearchInput');
              if (tacoSearch) {
                tacoSearch.value = 'arroz';
                tacoSearch.dispatchEvent(new Event('input'));
              }
            }
          }, 400);
        }, 600);
      }, 700);
    };
  </script>
</body>
</html>
